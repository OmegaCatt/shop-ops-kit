name: Verify Shop Ops Kit
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test
      - run: pnpm check
      - run: pnpm qa
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: shop-ops-workflow-preview
          path: docs/workflow*.png
          retention-days: 7
